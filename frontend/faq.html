<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - FAQ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
        <div class="header-container">
            <h2>StudentHub</h2>
            <nav aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="assignment.html">Assignment</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li><a href="faq.html" class="active">FAQ</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main id="main-content">
        <section class="faq-container" aria-labelledby="faq-heading">
            <h1 id="faq-heading">Frequently Asked Questions</h1>

            <div class="data-toolbar faq-toolbar">
                <label class="search-box">
                    <span class="sr-only">Search FAQs</span>
                    <input type="search" id="faq-search" placeholder="Search FAQ..." aria-label="Search FAQ">
                </label>

                <label class="filter-box">
                    <span>Category</span>
                    <select id="faq-category-filter" aria-label="Filter FAQs by category">
                        <option value="all">All Topics</option>
                    </select>
                </label>

                <label class="sort-box">
                    <span>Sort by</span>
                    <select id="faq-sort" aria-label="Sort FAQs">
                        <option value="id-asc">Default order</option>
                        <option value="question-asc">Question: A-Z</option>
                        <option value="category-asc">Category: A-Z</option>
                    </select>
                </label>
            </div>

            <div id="faq-list" class="faq-list" aria-live="polite"></div>
            <div id="faq-pagination" class="pagination" aria-label="FAQ pagination"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Academic Portal. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
