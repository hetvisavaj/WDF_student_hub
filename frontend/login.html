<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h2>StudentHub</h2>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="login.html" class="active">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="login-card">
            <h1>StudentHub Login</h1>
            <!-- Action submits directly to home page via pure HTML -->
            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="login-email">Academic Email:</label>
                    <input type="email" id="login-email" name="email" required placeholder="student@univ.edu">
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit">Sign In</button>
            </form>
            <div class="login-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Academic Portal. All rights reserved.</p>
    </footer>
</body>
</html>
