<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Student Registration</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .register-card {
            max-width: 560px;
            margin: 0 auto;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .radio-group {
            display: flex;
            gap: 1.25rem;
            align-items: center;
            margin-top: 0.25rem;
        }
        .radio-label, .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
            cursor: pointer;
        }
        .radio-label input, .checkbox-label input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        .error-message {
            color: #dc2626;
            font-size: 0.8rem;
            min-height: 1.1rem;
            margin-top: 0.15rem;
        }
        input.invalid, select.invalid {
            border-color: #dc2626 !important;
            background-color: #fef2f2;
        }
        input.valid, select.valid {
            border-color: #16a34a !important;
        }
        .success-banner {
            display: none;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <h2>StudentHub</h2>
            <nav aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="register.html" class="active">Register</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="register-card">
            <h1>Student Registration</h1>
            
            <div id="success-banner" class="success-banner" role="alert">
                Registration successful! Redirecting to login...
            </div>

            <form id="registration-form" novalidate action="http://localhost/PRACTICAL-7/index.php" method="post">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="reg-name">Full Name:</label>
                    <input type="text" id="reg-name" name="fullname" placeholder="e.g., Jane Doe">
                    <span class="error-message" id="name-error"></span>
                </div>

                <!-- Academic Email -->
                <div class="form-group">
                    <label for="reg-email">Academic Email:</label>
                    <input type="email" id="reg-email" name="email" placeholder="student@univ.edu">
                    <span class="error-message" id="email-error"></span>
                </div>

                <!-- Mobile Number -->
                <div class="form-group">
                    <label for="reg-mobile">Mobile Number:</label>
                    <input type="tel" id="reg-mobile" name="mobile" placeholder="10-digit mobile number">
                    <span class="error-message" id="mobile-error"></span>
                </div>

                <!-- Password & Confirm Password -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-password">Password:</label>
                        <input type="password" id="reg-password" name="password" placeholder="••••••••">
                        <span class="error-message" id="password-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm-password">Confirm Password:</label>
                        <input type="password" id="reg-confirm-password" name="confirmPassword" placeholder="••••••••">
                        <span class="error-message" id="confirm-password-error"></span>
                    </div>
                </div>

                <!-- Course & Year -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-course">Course / Department:</label>
                        <select id="reg-course" name="course">
                            <option value="">Select Course</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                        </select>
                        <span class="error-message" id="course-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="reg-year">Year of Study:</label>
                        <select id="reg-year" name="year">
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                        <span class="error-message" id="year-error"></span>
                    </div>
                </div>

                <!-- Gender Radio Group -->
                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group" role="radiogroup" aria-labelledby="gender-label">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="male"> Male
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="female"> Female
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="other"> Other
                        </label>
                    </div>
                    <span class="error-message" id="gender-error"></span>
                </div>

                <!-- Terms Acceptance -->
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="reg-terms" name="terms">
                        <span>I accept the <a href="#" target="_blank">terms and conditions</a></span>
                    </label>
                    <span class="error-message" id="terms-error"></span>
                </div>

                <button type="submit">Complete Registration</button>
            </form>

            <div class="register-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Academic Portal. All rights reserved.</p>
    </footer>

    <!-- Form Validation Script -->
    <script src="validate.js"></script>
</body>
</html>
