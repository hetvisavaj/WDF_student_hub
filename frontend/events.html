<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Events</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
        <div class="header-container">
            <h2>StudentHub</h2>
            <nav aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="assignment.html">Assignment</a></li>
                    <li><a href="events.html" class="active">Events</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="events-container" aria-labelledby="events-heading">
            <h1 id="events-heading">Campus Events Calendar</h1>

            <div class="data-toolbar">
                <label class="search-box">
                    <span class="sr-only">Search events</span>
                    <input type="search" id="event-search" placeholder="Search events..." aria-label="Search events">
                </label>

                <label class="filter-box">
                    <span>Category</span>
                    <select id="event-category-filter" aria-label="Filter events by category">
                        <option value="all">All Categories</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Career">Career</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Community">Community</option>
                        <option value="Competition">Competition</option>
                    </select>
                </label>

                <label class="sort-box">
                    <span>Sort by</span>
                    <select id="event-sort" aria-label="Sort events">
                        <option value="date-asc">Date: Earliest</option>
                        <option value="date-desc">Date: Latest</option>
                        <option value="title-asc">Title: A-Z</option>
                    </select>
                </label>
            </div>

            <div id="events-list" class="events-list" aria-live="polite"></div>

            <div class="pagination" id="event-pagination" aria-label="Event pagination"></div>

            <section class="event-registration" aria-labelledby="registration-heading">
                <h2 id="registration-heading">Event Registration</h2>
                <form id="event-registration-form" action="http://localhost/PRACTICAL/event_register.php" method="post">
                    <div class="form-group">
                        <label for="event-name">Event Name:</label>
                        <input type="text" id="event-name" name="event_name" placeholder="Enter the event name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="attendee-name">Full Name:</label>
                            <input type="text" id="attendee-name" name="attendee_name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="student-id">Student ID:</label>
                            <input type="text" id="student-id" name="student_id" placeholder="e.g., STU-2026-001" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="event-date">Event Date:</label>
                            <input type="date" id="event-date" name="event_date" required>
                        </div>
                        <div class="form-group">
                            <label for="event-type">Event Type:</label>
                            <select id="event-type" name="event_type" required>
                                <option value="">Select Event Type</option>
                                <option value="Workshop">Workshop</option>
                                <option value="Career">Career</option>
                                <option value="Seminar">Seminar</option>
                                <option value="Community">Community</option>
                                <option value="Competition">Competition</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="attendee-email">Email Address:</label>
                        <input type="email" id="attendee-email" name="attendee_email" placeholder="student@univ.edu" required>
                    </div>

                    <button type="submit">Register for Event</button>
                </form>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Academic Portal. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
